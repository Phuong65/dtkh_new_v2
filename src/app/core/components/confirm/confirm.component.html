@if (head) {
<div class="modal-header">
    <h4 class="modal-title">{{head}}</h4>
    <button pButton pRipple type="button" icon="pi pi-times" class="p-button-rounded p-button-danger p-button-text close" (click)="close()"></button>
</div>
}
<div class="modal-body">
    <div class="modal-body-content" [innerHTML]="body | appSafeHtml"></div>
</div>
@if (buttons && buttons.length) {
<div class="modal-footer">
    @for (btn of buttons; track $index) {
        <button pButton pRipple type="button" [label]="'buttons.'+btn.name | translate" [class]="btn.class" [icon]="btn.icon"
            [attr.data-button-name]="btn.name" (click)="confirmAction(btn)"></button>
    }
</div>
}
