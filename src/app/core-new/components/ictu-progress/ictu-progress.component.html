<div class="ictu-progress">
    <div class="ictu-progress__content">
        @if (heading()) {
        <p class="ictu-progress__heading">{{ heading() }}</p>
        }
        <div class="ictu-progress__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
            [attr.aria-valuenow]="percent()">
            <div class="ictu-progress__bar-value" [style.width.%]="percent()"></div>
        </div>
        <p class="ictu-progress__percent">{{ percent() }}%</p>
    </div>
</div>
