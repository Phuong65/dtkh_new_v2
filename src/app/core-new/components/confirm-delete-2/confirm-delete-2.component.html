<div class="ictu-confirm-dialog">
    <div class="ictu-confirm-dialog__icon-wrap">
        <span class="ictu-confirm-dialog__icon">
            <i class="ti ti-trash" aria-hidden="true"></i>
        </span>
    </div>
    <div class="ictu-confirm-dialog__body">
        <h4 class="ictu-confirm-dialog__heading">{{ heading() }}</h4>
        <div [innerHTML]="htmlMessage() | safeHtml" class="ictu-confirm-dialog__message"></div>
    </div>
    <div class="ictu-confirm-dialog__actions">
        <button type="button" (click)="confirm($event, false)" class="btn ictu-confirm-dialog__btn ictu-confirm-dialog__btn--cancel" mat-button>Hủy bỏ</button>
        <button type="button" (click)="confirm($event, true)" class="btn ictu-confirm-dialog__btn ictu-confirm-dialog__btn--confirm" mat-button>Có, tôi muốn xóa</button>
    </div>
</div>
