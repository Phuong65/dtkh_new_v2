        <div class="login-template-v3__right-position">
            <div class="login-template-v3__wrap-form">
                <h2 class="login-template-v3__form-title intro-x">Xin chào!</h2>
                <h4 class="login-template-v3__form-subtitle intro-x">Vui lòng đăng nhập để làm việc với hệ thống...</h4>
                <form action="#" class="login-template-v3__form intro-x" [class.login-template-v3__form--loading]="signInButton.isLoading" [formGroup]="loginForm" autocomplete="off">
                    <div class="login-template-v3__input-field">
                        <input type="text" placeholder="Tài khoản" formControlName="username" autocomplete="off" (keydown)="handleInputKeyDown($event)"/>
                    </div>
                    <div class="login-template-v3__input-field login-template-v3--password">
                        <input [type]="formFieldPassword.field" placeholder="Mật khẩu" formControlName="password" autocomplete="off" (keydown)="handleInputKeyDown($event)"/>
                        <button class="btn sign-up-form__show-password" (click)="toggleShowPassword()"><i [class]="formFieldPassword.icon" ></i></button>
                    </div>
                    <div class="login-template-v3__input-field--buttons">
                        <button class="btn login-template-v3__sign-up-form__btn" (click)="btnSignIn(signInButton)">
                            <i class="pi pi-sign-in" ></i>Đăng nhập
                        </button>
                        <div class="login-template-v3__sign-up-form__separate">
                            <span class="login-template-v3__sign-up-form__separate__inner">Hoặc</span>
                        </div>
                        <div id="sign-up-form__btn--google-sign-in" style="display: flex;justify-content: center;width: 100%;padding:0;"></div>
                    </div>
                </form>
