<div *ngIf="hasContent" class="question-file-preview">
    <div *ngFor="let part of questionImport" class="question-file-preview-content">
        <div #part_direction class="import-question-direction-part">
            {{part['question_direction'] | rawHtmlPipe : part_direction}}
        </div>
        <div *ngIf="part.media && part.media.path" class="mediaPreview">
            <label class="lable-preview-media" (click)="selectPreviewAudio(part)">[Click to
                view
                {{part.media.type==='audio'?'Audio':'Video'}}]</label>
            <div class="mediaPreview-content {{part.media.type === 'video' && part['media_open']?'video-preview-active':null}}"
                [ngClass]="part['media_open']?'audio-preview-active':null">
                <audio-viewer [width]="442" [height]="250" [type]="part.media.type" *ngIf="part['media_open']"
                    [path]="part.media.path" [source]="part.media.source">
                </audio-viewer>
            </div>
        </div>
        <div class="import-questTion-option" *ngFor='let quest of part["children"]; let i = index'>
            <div class="import-question-direction-child">
                <strong>{{quest.question_number}}.</strong>
                <div #questionDirection class="import-question-direction-content">
                    {{quest.question_direction | rawHtmlPipe : questionDirection}}
                </div>
            </div>

            <div class="question_answer_setting">
                <label class="title-setting-question">Cài đặt</label>
                <div class="row form-row form-row-flex-row">
                    <div class="col-6 flex-div">
                        <label>Hiển thị số lượng đáp án trên 1 dòng:</label>
                        <div class="group_select_cols">
                            <div class="col_select_item" *ngFor="let col of option_show_anwser_col, index as k">
                                <input [(ngModel)]="quest['config']['cols']" type="radio" [value]="col['value']"
                                    [name]="'config'+part['keyParent'].toString()+'_'+i.toString()">
                                <span>{{col['value']}}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lesson-answer-content">
                <container-element [ngSwitch]="quest.question_type">
                    <ng-container *ngSwitchCase="'radio'">
                        <ovic-groups-radio-v2 [columns]="quest['config']['cols']"
                            [group_name]="'group_'+part['keyParent'].toString()+'_'+i.toString()"
                            styleClass="radio-answer-lesson"
                            *ngIf="quest.answer_option && quest.answer_option.length !== 0" [verticalMode]="false"
                            [rawHtml]="true" [options]="quest.answer_option" optionLabel="value" optionId="id"
                            [defaultValue]="quest.answer_correct[0]"
                            [show_image]="quest.answer_option[0].value | pipeCheckImg"
                            (onChange)="onChangeRadioAnswer(quest,$event)">
                        </ovic-groups-radio-v2>
                    </ng-container>
                    <ng-container *ngSwitchCase="'checkbox'">
                        <ovic-groups-checkbox [show_image]="quest.answer_option[0].value | pipeCheckImg"
                            [columns]="quest['config']['cols']" classes="radio-answer-lesson"
                            *ngIf="quest.answer_option && quest.answer_option.length !== 0" [verticalMode]="false"
                            [rawHtml]="true" [options]="quest.answer_option" optionLabel="value" optionId="id"
                            [default]="quest.answer_correct[0]" (onChange)="onChangeCheckboxAnswer(quest,$event)">
                        </ovic-groups-checkbox>
                    </ng-container>
                </container-element>
                <p class="question-hint-exp" *ngIf="quest.hint"><strong>Hint</strong>:
                    {{quest.hint}}</p>
                <p class="question-hint-exp question-exp" *ngIf="quest.explain">
                    <strong>Explain</strong>:
                    {{quest.explain}}
                </p>
            </div>
        </div>
    </div>
</div>
