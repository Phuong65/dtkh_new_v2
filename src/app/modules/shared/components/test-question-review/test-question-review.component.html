<div *ngIf="list_question && list_question.length" class="question-file-preview">
    <div *ngFor="let part of list_question" class="question-file-preview-content">
        <div [ngClass]="!part['expand']?'show-code-only-class':''" class="import-question-direction-code ">
            <span class="import-question-direction-code-name">#{{part.id}}{{part.code?" -
                ("+part.code+")": ""}}</span>
            <span (click)="expandAndCom(part)" class="action-icon" [matTooltip]="part['expand']? 'Thu gọn':'Mở'"
                matTooltipPosition="above">
                <i [ngClass]="part['expand']?'fa fa-compress':'fa fa-expand'" ></i>
            </span>
            <span *ngIf="showDelete" class="action-icon" (click)="deleteDataQuest(part)">
                <i style="font-size: 16px;" class="fa fa-trash"></i>
            </span>
        </div>
        <div class="show-content-question" [ngClass]="!part['expand']?'displaynone-class':''">
            <div style="padding-top: 15px;" class="import-question-direction-part"
                [innerHTML]="part['question_direction'] | ovicSafeHtml">
            </div>
            <div *ngIf="part.media && part.media.path" class="mediaPreview">
                <label class="lable-preview-media" (click)="selectPreviewAudio(part)">[Click to
                    view
                    {{part.media.type==='audio'?'Audio':'Video'}}]</label>
                <div class="mediaPreview-content {{part.media.type === 'video' && part['media_open']?'video-preview-active':null}}"
                    [ngClass]="part['media_open']?'audio-preview-active':null">
                    <audio-viewer [width]="442" [height]="250" [type]="part.media.type" *ngIf="part['media_open']"
                        [path]="part.media.path" [source]="part.media.source">
                    </audio-viewer>
                </div>
            </div>
            <div class="import-questTion-option" *ngFor='let quest of part["children"]; let i = index'>
                <div class="import-question-direction-child">
                    <strong>{{quest.question_number}}.</strong>
                    <div [innerHTML]="quest.question_direction | ovicSafeHtml"
                        class="import-question-direction-content"></div>
                </div>
                <div class="lesson-answer-content">
                    <container-element [ngSwitch]="quest.question_type">
                        <ng-container *ngSwitchCase="'radio'">
                            <ovic-groups-radio-v2 [disabled]="true"
                                [show_image]="quest.answer_option[0].value | pipeCheckImg"
                                [columns]="quest['config'] && quest['config']['cols']?quest['config']['cols']:1"
                                [group_name]="'group_'+part.id.toString()+'_'+i.toString()"
                                styleClass="radio-answer-lesson"
                                *ngIf="quest.answer_option && quest.answer_option.length !== 0" [verticalMode]="false"
                                [rawHtml]="true" [options]="quest.answer_option" optionLabel="value" optionId="id"
                                [defaultValue]="quest.answer_correct[0]">
                            </ovic-groups-radio-v2>
                        </ng-container>
                        <ng-container *ngSwitchCase="'checkbox'">
                            <ovic-groups-checkbox [disabled]="true"
                                [show_image]="quest.answer_option[0].value | pipeCheckImg"
                                [columns]="quest['config'] &&  quest['config']['cols'] ? quest['config']['cols']:1"
                                classes="radio-answer-lesson"
                                *ngIf="quest.answer_option && quest.answer_option.length !== 0" [verticalMode]="false"
                                [rawHtml]="true" [options]="quest.answer_option" optionLabel="value" optionId="id"
                                [default]="quest.answer_correct[0]">
                            </ovic-groups-checkbox>
                        </ng-container>
                    </container-element>
                    <p class="question-hint-exp" *ngIf="quest.hint"><strong>Hint</strong>:
                        {{quest.hint}}</p>
                    <p class="question-hint-exp question-exp" *ngIf="quest.explain">
                        <strong>Explain</strong>:
                        {{quest.explain}}
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 16px;"
    *ngIf="!list_question || !list_question.length" class="question-file-preview">
    <span>Không có câu hỏi nào</span>
</div>
