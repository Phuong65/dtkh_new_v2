<ng-container *ngTemplateOutlet="templateEditor">

</ng-container>

<ng-template #templateEditor>
  @if (!isReadyToLoad) {
    <div class="editor-skeleton">
      <div class="skeleton-toolbar"></div>
      <div class="skeleton-content">Đang tải trình soạn thảo...</div>
    </div>
  }
  @if (isReadyToLoad) {
    <div [appKatexImg]="countChange" [appLoadMediaOnText]="countChange"
      class="document-editor_basic" [ngClass]="isMaximize?'maximize-editor-mode':''">
      <div #editorContent id="editor" class="document-editor__editable {{styleClass}}">
      </div>
    </div>
  }
</ng-template>
