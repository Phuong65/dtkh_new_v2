<div class="layout-list-editor-value">
  <ul cdkDropList class="custom-dash-list" (cdkDropListDropped)="drop($event)">
    @for (item of listValue; track item; let i = $index) {
      <li cdkDrag class="item-list-value">
        <div (keyup)="onKeyUpEditor(editor,i)" (keydown)="onKeyDown($event,i)" contenteditableModel
          [(ngModel)]="item['value']" contenteditable="true" (paste)="onPaste($event)" #editor
          class="content-editor-list">
        </div>
        <div class="example-custom-placeholder" *cdkDragPlaceholder></div>
        @if (listValue.length !== 1) {
          <button type="button" class="btn btn-secondary btn-icon btn-transparent" cdkDragHandle aria-label="Kéo để đổi thứ tự">
            <i class="fa fa-arrows" aria-hidden="true"></i>
          </button>
        }
        @if (listValue.length !== 1) {
          <button type="button" (click)="deleteList(i)"
            class="btn btn-danger btn-icon btn-transparent" aria-label="Xóa nội dung">
            <i class="fa fa-trash grey" aria-hidden="true"></i>
          </button>
        }
      </li>
    }
  </ul>
  <div class="list-editor-actions" [class.list-editor-actions--button-mode]="addByButton">
    @if (addByButton) {
      <button type="button" class="btn ictu-badge-btn--primary-reverse list-editor-add-btn" (click)="addItemByButton()">
        <i class="fa fa-plus" aria-hidden="true"></i> Thêm nội dung
      </button>
    } @else {
      <span class="red">Nhấn <strong>Tab</strong> để xuống hoặc thêm dòng (nếu con trỏ chuột ở dòng cuối)</span>
    }
    @if (listValue && listValue.length) {
      <button (click)="deleteAllList()" pButton pRipple icon="pi pi-trash"
      type="button" label="Xóa tất cả" class="p-button-danger p-button-text list-editor-clear-btn"></button>
    }
  </div>
</div>
