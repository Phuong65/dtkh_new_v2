<div class="latex-dialog-container">
  <div class="modal-header bg-light py-2 border-bottom">
    <h6 class="modal-title font-weight-bold text-primary">
      <i class="fa fa-functions mr-2"></i>Chèn công thức Toán học
    </h6>
    <button type="button" class="close" (click)="onCancel()" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body p-3">
    <div class="latex-presets-wrapper border rounded bg-white">
      <div class="presets-all-container p-2" style="max-height: 250px; overflow-y: auto; display: flex; flex-wrap: wrap;">
        @for (item of presetGroups; track item) {
          <div class="d-flex flex-wrap">
            <button type="button" class="btn btn-light border m-1 preset-btn" (click)="insertPreset(item.f)"
              [title]="item.label">
              <span class="latex-icon">\({{item.f}}\)</span>
            </button>
          </div>
        }
      </div>
    </div>

    <div class="form-group mb-3">
      <label class="font-weight-bold small text-secondary mb-1 font-size-16">Mã LaTeX:</label>
      <textarea class="form-control latex-textarea shadow-none" rows="4" [(ngModel)]="latexInput"
        (input)="renderLatexPreview()" placeholder="Ví dụ: \frac{a}{b}, \sqrt{x}, \sum_{i=1}^{n} i^2">
      </textarea>
    </div>

    <label class="font-weight-bold small text-secondary mb-1 font-size-16">Xem trước:</label>
    <div class="preview-box border rounded d-flex align-items-center justify-content-center shadow-sm bg-white">
      <div #previewArea class="katex-display-area w-100 text-center p-3">
      </div>
    </div>
  </div>

  <div class="modal-footer bg-light border-top py-2 px-3">
    <button type="button" class="btn btn-sm btn-outline-secondary px-4 font-weight-bold" (click)="onCancel()">
      Hủy bỏ
    </button>
    <button type="button" class="btn btn-sm btn-primary px-4 font-weight-bold shadow-sm" (click)="onConfirm()">
      Chèn vào bài viết
    </button>
  </div>
</div>
