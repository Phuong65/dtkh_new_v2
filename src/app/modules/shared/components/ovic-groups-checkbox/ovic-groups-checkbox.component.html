<ul class="ovic-radios {{classes + ' '+ classOrther}} ovic-checkbox-answer-layout {{show_image?'group-checkbox-image':''}}"
    [ngClass]="verticalMode ? 'ovic-radios--vertical': 'ovic-radios--horizontal'">
    <li *ngFor="let elm of options ; let i=index" class="{{setActiveLi(i)}}"
        [ngClass]="verticalMode ? 'ovic-radios__elm' : ''.concat('ovic-radios__elm ','layout-',columns.toString(),'-columns')">
        <button [disabled]="disabled" class="ov-btn-radio" [ngClass]="correct_object[i + 1] ? 'active' : null "
            (click)="updateValue(elm[optionId],i)">
            <span class="ov-prefix"></span>
            <span class="ovic-radios__text" *ngIf="!rawHtml">{{elm[optionLabel]}}</span>
            <p #answerCheckbox class="ovic-radios__text" *ngIf="rawHtml">
                {{elm[optionLabel] | rawHtmlPipe : answerCheckbox}}
            </p>
        </button>
    </li>
</ul>
