<div class="ovic-navigation">
  <ul class="ovic-navigation__list">
    @for (btn_nav of navigator.navs; track btn_nav; let i = $index) {
      <li class="ovic-navigation__list-eml {{btn_nav.class}}">
        @if ( !btn_nav.isActive && btn_nav.type === 'button') {
          <button type="button" class="ovic-navigation__nav-link" (click)="navClick(btn_nav.page)">{{btn_nav.title}}</button>
        }
        @if (btn_nav.isActive || btn_nav.type !== 'button') {
          <span class="ovic-navigation__nav-link">{{btn_nav.title}}
            @if (btn_nav.isActive) {
              <i class="last-page-in-mobile"> / {{navigator.lastsPage}}</i>
            }
          </span>
        }
      </li>
    }
  </ul>
</div>
