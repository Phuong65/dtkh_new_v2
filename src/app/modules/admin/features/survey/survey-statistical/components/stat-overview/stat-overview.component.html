<div class="stat-overview" *ngIf="overview">
    <div class="stat-overview__cards">
        <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--primary">
                <i class="pi pi-users"></i>
            </div>
            <div class="stat-card__content">
                <span class="stat-card__value stat-card__value--small">{{ formatNumber(overview.totalResponses) }}</span>
                <span class="stat-card__label">Lượt trả lời</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--success">
                <i class="pi pi-list"></i>
            </div>
            <div class="stat-card__content">
                <span class="stat-card__value stat-card__value--small">{{ overview.totalQuestions }}</span>
                <span class="stat-card__label">Câu hỏi</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--warning">
                <i class="pi pi-calendar"></i>
            </div>
            <div class="stat-card__content">
                <span class="stat-card__value stat-card__value--small">{{ overview.startDate | date:'dd/MM/yyyy' }} - {{ overview.endDate | date:'dd/MM/yyyy' }}</span>
                <span class="stat-card__label">Thời gian</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--info">
                <i class="pi pi-book"></i>
            </div>
            <div class="stat-card__content">
                <span class="stat-card__value stat-card__value--small">{{ overview.schoolYear }} - HK{{ overview.semester }}</span>
                <span class="stat-card__label">Năm học</span>
            </div>
        </div>

        <div class="stat-card" *ngIf="overview.khoa && overview.khoa.length > 0">
            <div class="stat-card__icon stat-card__icon--success">
                <i class="pi pi-building"></i>
            </div>
            <div class="stat-card__content">
                <span class="stat-card__value stat-card__value--small">
                    <ng-container *ngFor="let khoa of overview.khoa; let last = last">K{{ khoa }}<span *ngIf="!last">, </span></ng-container>
                </span>
                <span class="stat-card__label">Khóa học</span>
            </div>
        </div>
    </div>
</div>
