<div class="stat-text-responses">
    <div *ngIf="responses.length === 0" class="no-data">
        <p>Chưa có câu trả lời nào</p>
    </div>

    <div *ngIf="responses.length > 0">
        <div class="text-responses__header">
            <span class="response-count">Tổng: {{ total }} câu trả lời ({{ grouped.length }} đáp án khác nhau)</span>
            <div class="view-toggle">
                <button type="button"
                        class="view-toggle__btn"
                        [class.active]="viewMode === 'grouped'"
                        (click)="viewMode = 'grouped'">
                    Thống kê
                </button>
                <button type="button"
                        class="view-toggle__btn"
                        [class.active]="viewMode === 'all'"
                        (click)="viewMode = 'all'">
                    Tất cả
                </button>
            </div>
        </div>

        <!-- View gộp -->
        <p-table *ngIf="viewMode === 'grouped'"
                 [value]="grouped" [paginator]="true" [rows]="4">
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 60px" class="text-center">STT</th>
                    <th>Nội dung trả lời</th>
                    <th class="text-center" style="width: 100px">Số lượt</th>
                    <th class="text-center" style="width: 100px">Tỷ lệ</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item let-i="rowIndex">
                <tr>
                    <td class="text-center">{{ i + 1 }}</td>
                    <td>{{ item.value }}</td>
                    <td class="text-center">{{ item.count }}</td>
                    <td class="text-center">{{ item.percentage }}%</td>
                </tr>
            </ng-template>
        </p-table>

        <!-- View all (raw) -->
        <p-table *ngIf="viewMode === 'all'"
                 [value]="responses" [paginator]="true" [rows]="5">
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 60px" class="text-center">STT</th>
                    <th>Nội dung trả lời</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-response let-i="rowIndex">
                <tr>
                    <td class="text-center">{{ i + 1 }}</td>
                    <td>{{ response }}</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
