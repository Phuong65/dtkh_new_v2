<div class="input-question-direction">

    <div class="editor-skeleton">
      <div class="skeleton-toolbar"></div>
      <div class="skeleton-content">Đang tải trình soạn thảo...</div>
    </div>
  }
  @if (isReadyToLoad) {
    <div class="document-editor_basic" [appLoadMediaOnText]="countChanges"

    </div>
  }
