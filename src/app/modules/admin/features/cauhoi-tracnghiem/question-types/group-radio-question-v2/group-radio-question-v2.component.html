<div class="row">
  <div class="col-12">
    <div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
      <p class="form-row mt-0">
        <label for="question_number">Câu hỏi số</label>
        @if (question) {
          <input id="question_number" class="ovic-input-field"
            [(ngModel)]="question.question_number">
        }
      </p>
    </div>
  </div>
  <div class="col-12">
    <div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2 height-100px-editor">
      <p class="form-row mb-5">
        <label for="question_number">Nội dung câu hỏi
          <span class="ovic-mark">*</span>
        </label>
        <ovic-ckeditor-document (onChange)="ckEditorSetup($event)" [default]="desc_question.value"
          [changeId]="question?.id">
        </ovic-ckeditor-document>
      </p>
    </div>
  </div>
</div>

@if (question) {
  <div class="question-type-radio" [class.question-type-radio-editor--input-mode]="!isPresent"
    [ngClass]="'question-type-radio-editor--'+(multiple ? 'multiple':'single')">
    @if (options) {
      <ul class="question-type-radio__list">
        @for (o of options; track o) {
          <li class="question-type-radio__list__element"
            [ngClass]="'question-type-radio__list__element--size-'+question.config.cols">
            <div class="question-type-radio__option"
              [class.question-type-radio__option--correct]="isCorrectAnswer(o.answer)">
              @if (!isPresent) {
                <div class="question-type-radio-editor__node d-flex"
                  [class.question-type-radio-editor__node--highlight]="isCorrectAnswer(o.answer)">
                  <div class="question-type-radio-editor__node__prefix">
                    <button (click)="markCorrectAnswer(o.answer)"
                    class="question-type-radio-editor__node__prefix__btn">{{ o.prefix }}</button>
                  </div>
                  <div class="question-type-radio-editor__node__direction">
                    <app-input-question-direction [htmlInputModel]="o.answer"></app-input-question-direction>
                  </div>
                  <div class="question-type-radio-editor__node__buttons">
                    <button (click)="deleteAnswer(o)" pButton pRipple icon="pi pi-trash"
                    class="question-type-radio__option__btn-remove p-button-danger p-button-rounded p-button-text p-button-outlined"></button>
                  </div>
                </div>
                <!--                    <button (click)="uploadFile(o)" pButton pRipple icon="pi pi-camera" tooltipStyleClass="ictu-p-tooltip" pTooltip="Đính kèm ảnh" tooltipPosition="top" class="question-type-radio__option__attach-file"></button>-->
                <!--                    <button (click)="markCorrectAnswer(o.answer)" pButton pRipple [icon]="isCorrectAnswer(o.answer) ? 'pi pi-check-circle' : 'pi pi-circle'" class="question-type-radio__option__prefix"></button>-->
                <!--                    <input *ngIf="o.type === 'text'" type="text" pInputText class="question-type-radio__option__input flex-fill" [(ngModel)]="o.answer.value">-->
                <!--                    <div class="question-type-radio__option__input question-type-radio__option__input&#45;&#45;media flex-fill" *ngIf="o.type === 'media'" [appLoadMediaOnText]="o.answer.id + change" [innerHTML]="o.answer.value | safeHtmlSingle"></div>-->
                <!--                    <button (click)="deleteAnswer(o)" pButton pRipple icon="pi pi-trash" class="question-type-radio__option__btn-remove p-button-danger p-button-rounded p-button-text p-button-outlined"></button>-->
              } @else {
                <button pButton pRipple [icon]="isCorrectAnswer(o.answer) ? 'pi pi-check-circle' : 'pi pi-circle'"
                class="question-type-radio__option__prefix"></button>
                <div class="question-type-radio__option__input question-type-radio__option__input--media flex-fill"
                  [appKatexImg]="o.answer.id + change" [appLoadMediaOnText]="o.answer.id + change"
                [innerHTML]="o.answer.value | safeHtmlSingle"></div>
              }
            </div>
          </li>
        }
      </ul>
    }
    @if (!isPresent) {
      <div class="question-type-radio__footer d-flex justify-content-between align-items-center">
        <p-checkbox [(ngModel)]="question.config.invertedAnswer" [binary]="true"
        label="Đảo vị trí của phương án trả lời"></p-checkbox>
        <div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
          <p class="form-row mt-0">
            <p-dropdown appendTo="body" class="input-element ovic-dropdown-style" [filter]="false" [options]="colOptions"
              [(ngModel)]="question.config.cols" optionLabel="label" optionValue="value" optionDisabled="disable"
            placeholder="--Lựa chọn--"></p-dropdown>
          </p>
        </div>
        <button (click)="addMoreAnswerOption()" class="typical-question__btn-add">
          <i class="pi pi-plus-circle"></i>Thêm phương án trả lời
        </button>
      </div>
    }
  </div>
}
