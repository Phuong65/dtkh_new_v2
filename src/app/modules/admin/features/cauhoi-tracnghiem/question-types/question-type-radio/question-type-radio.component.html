@if (question) {
  <div class="question-type-radio">
    @if (options) {
      <ul class="question-type-radio__list">
        @for (o of options; track o) {
          <li class="question-type-radio__list__element"
            [ngClass]="'question-type-radio__list__element--size-'+question.config.cols">
            <div class="question-type-radio__option"
              [class.question-type-radio__option--correct]="isCorrectAnswer(o.answer)">
              @if (!isPresent) {
                <button (click)="uploadFile(o)" pButton pRipple icon="pi pi-camera"
                  tooltipStyleClass="ictu-p-tooltip" pTooltip="Đính kèm ảnh" tooltipPosition="top"
                class="question-type-radio__option__attach-file"></button>
                <button (click)="markCorrectAnswer(o.answer)" pButton pRipple
                  [icon]="isCorrectAnswer(o.answer) ? 'pi pi-check-circle' : 'pi pi-circle'"
                class="question-type-radio__option__prefix"></button>
                @if (o.type === 'text') {
                  <input type="text" pInputText
                    class="question-type-radio__option__input flex-fill" [(ngModel)]="o.answer.value">
                }
                @if (o.type === 'media') {
                  <div class="question-type-radio__option__input question-type-radio__option__input--media flex-fill"
                    [appKatexImg]="o.answer.id + change"
                  [appLoadMediaOnText]="o.answer.id + change" [innerHTML]="o.answer.value | safeHtmlSingle"></div>
                }
                <button (click)="deleteAnswer(o)" pButton pRipple icon="pi pi-trash"
                class="question-type-radio__option__btn-remove p-button-danger p-button-rounded p-button-text p-button-outlined"></button>
              } @else {
                <button pButton pRipple [icon]="isCorrectAnswer(o.answer) ? 'pi pi-check-circle' : 'pi pi-circle'"
                class="question-type-radio__option__prefix"></button>
                <div class="question-type-radio__option__input question-type-radio__option__input--media flex-fill"
                  [appKatexImg]="o.answer.id + change" [appLoadMediaOnText]="o.answer.id + change"
                [innerHTML]="o.answer.value | safeHtmlSingle"></div>
              }
            </div>
          </li>
        }
      </ul>
    }
    @if (!isPresent) {
      <div class="question-type-radio__footer d-flex justify-content-between align-items-center">
        <p-checkbox [(ngModel)]="question.config.invertedAnswer" [binary]="true"
        label="Đảo vị trí của phương án trả lời"></p-checkbox>
        <div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
          <p class="form-row mt-0">
            <p-dropdown appendTo="body" class="input-element ovic-dropdown-style" [filter]="false" [options]="colOptions"
              [(ngModel)]="question.config.cols" optionLabel="label" optionValue="value" optionDisabled="disable"
            placeholder="--Lựa chọn--"></p-dropdown>
          </p>
        </div>
        <button (click)="addMoreAnswerOption()" class="typical-question__btn-add">
          <i class="pi pi-plus-circle"></i>Thêm phương án trả lời
        </button>
      </div>
    }
  </div>
}
