<div class="layout_component_container">
  <div class="document-type-a4" style="position: relative;">
    <button ngbTooltip="Lưu lại" placement="top" container="body"
      style="position: sticky; top: 20px; margin-top: -65px; margin-left: 721px; z-index: 10;"
      class="btn btn-primary btn-icon" (click)="saveCtdt()">
      <i class="fa fa-floppy-o"></i>
    </button>
    @if (selectedCtdt) {
      <div class="ovic-vertical__inputs" style="line-height: 1.5;">
        <form [formGroup]="formCtdt" class="formCtdt" style="line-height: 1;">
          <div class="row form-row form-row-flex-row">
            <div class="col-12 flex-div">
              <label for="ten">Tên Chương trình Đào tạo:<span class="ovic-mark">*</span></label>
              <input type="text" id="ten" class="ovic-input-field" formControlName="ten" autocomplete="off">
            </div>
          </div>
          <div class="row form-row form-row-flex-row">
            <div class="col-12 flex-div edit-hight-100 ">
              <label for="madt">Mã CTDT:<span class="ovic-mark">*</span></label>
              <input type="text" id="madt" class="ovic-input-field" formControlName="madt" autocomplete="off">
            </div>
          </div>
          <div class="row form-row form-row-flex-row">
            <div class="col-4 flex-div">
              <label for="ten">Đơn vị đào tạo:<span class="ovic-mark">*</span></label>
              <ovic-dropdown [disabled]="isManager ? false : true" (onChange)="onChangeDonviCM($event)"
                placeholder="---chọn khoa---" [options]="list_donvi" [defaultValue]="f['category_id'].value"
                optionId="id" optionLabel="title" [formField]="f['category_id']" [filter]="true"
              filterBy="title"></ovic-dropdown>
            </div>
            <div class="col-4 flex-div">
              <label for="ten">Ngành đào tạo:<span class="ovic-mark">*</span></label>
              <ovic-dropdown placeholder="--- chọn ngành ---"
                [options]="list_nganh | filter : f['category_id'].value : ['donvi_chuyenmon_id']"
                [defaultValue]="f['nganh_id'].value" optionId="id" optionLabel="title"
              [formField]="f['nganh_id']" [filter]="true" filterBy="title"></ovic-dropdown>
            </div>
            <div class="col-4 flex-div">
              <label for="thoigian_daotao">Hệ đào tạo:<span class="ovic-mark">*</span></label>
              <ovic-dropdown placeholder="--- chọn hệ đào tạo ---" [options]="list_hedt"
                [defaultValue]="f['he_dt'].value" optionId="kyhieu" optionLabel="title"
                [formField]="f['he_dt']" [filter]="true" filterBy="title">
              </ovic-dropdown>
            </div>
          </div>
          <div class="row form-row form-row-flex-row">
            <div class="col-4 flex-div">
              <label for="khoa_apdung">Khóa áp dụng:<span class="ovic-mark">*</span></label>
              <input (keydown)="pointQuestionKeyDown($event)" type="text" id="khoa_apdung"
                class="ovic-input-field" formControlName="khoa_apdung" autocomplete="off">
              </div>
              <div class="col-4 flex-div">
                <label for="thoigian_daotao">Thời gian đào tạo:<span class="ovic-mark">*</span></label>
                <input (keydown)="pointQuestionKeyDown($event)" type="text" id="thoigian_daotao"
                  class="ovic-input-field" formControlName="thoigian_daotao" autocomplete="off">
                </div>
                <div class="col-4 flex-div" style="line-height: 1.5;">
                  <label for="thoigian_daotao">Danh hiệu tốt nghiệp:<span class="ovic-mark">*</span></label>
                  <ovic-dropdown placeholder="--- chọn danh hiệu ---" [options]="danhhieu_totnghiep"
                    [defaultValue]="f['danhhieu_totnghiep'].value" optionId="key" optionLabel="label"
                    [formField]="f['danhhieu_totnghiep']" [filter]="true" filterBy="label">
                  </ovic-dropdown>
                </div>
              </div>
              <div class="row form-row form-row-flex-row">
                <div class="col-12 flex-div edit-hight-100 ">
                  <label for="khoa_apdung">Mô tả:<span class="ovic-mark">*</span></label>
                  <ovic-editor height="auto" [formField]="f['mota']" [default]="f['mota']['value']"></ovic-editor>
                </div>
              </div>
              <div class="row form-row form-row-flex-row">
                <div class="col-12 flex-div edit-hight-100 ">
                  <label for="khoa_apdung">Cơ hội học tập sau tốt nghiệp:<span class="ovic-mark">*</span></label>
                  <ovic-editor height="auto" [formField]="f['cohoihoctap_sautotnghiep']"
                    [default]="f['cohoihoctap_sautotnghiep']['value']">
                  </ovic-editor>
                </div>
              </div>
              <div class="row form-row form-row-flex-row">
                <div class="col-12 flex-div edit-hight-100">
                  <label for="khoa_apdung">Vị trí làm việc sau tốt nghiệp:<span class="ovic-mark">*</span></label>
                  <ovic-editor height="auto" [formField]="f['vitri_lamviec_sautotnghiep']"
                    [default]="f['vitri_lamviec_sautotnghiep']['value']">
                  </ovic-editor>
                </div>
              </div>
            </form>
          </div>
        }
      </div>
    </div>
