<section class="course-detail-shell" aria-label="Chi tiết học phần">
    <header class="course-detail-header">
        <div class="course-detail-header__left">
            <button type="button" class="course-detail-back-btn" (click)="goBack()"
                title="Quay lại danh sách" aria-label="Quay lại danh sách">
                <i class="ti ti-arrow-left" aria-hidden="true"></i>
            </button>
            <div class="course-detail-header-divider" aria-hidden="true"></div>
            <div class="course-detail-name" [title]="selectedCourse()?.title || 'Học phần'">
                {{ selectedCourse()?.title || 'Học phần' }}
            </div>
            <div class="course-detail-header-divider" aria-hidden="true"></div>
        </div>

        <nav class="course-detail-tabs" role="tablist" aria-label="Thanh điều hướng học phần">
            <div class="course-detail-tabs__track">
                @for (tab of tabs; track tab.id; let i = $index) {
                <button #tabButton type="button" class="course-detail-tab" role="tab" [id]="'course-tab-' + tab.id"
                    [class.course-detail-tab--active]="activeTabId() === tab.id"
                    [attr.aria-selected]="activeTabId() === tab.id" [attr.aria-controls]="'course-panel-' + tab.id"
                    [attr.tabindex]="activeTabId() === tab.id ? 0 : -1"
                    (click)="selectTab(tab.id)" (keydown)="onTabKeydown($event, i)">
                    <span class="course-detail-tab__icon" aria-hidden="true"><i [class]="tab.icon"></i></span>
                    <span class="course-detail-tab__label">{{ tab.label }}</span>
                    <span class="course-detail-tab__line" aria-hidden="true"></span>
                </button>
                }
            </div>
        </nav>
    </header>

    <main class="course-detail-body" [attr.aria-busy]="state() === 'loading'">
        @if (state() === 'loading') {
        <app-loading-progress heading="Đang tải học phần..." backdropFilter="blur(2px)"></app-loading-progress>
        } @else if (state() === 'error') {
        <div class="course-detail-error" role="alert">
            <span>{{ errorMessage() }}</span>
            @if (courseId()) {
            <button type="button" (click)="retryLoadCourse()">Tải lại</button>
            }
        </div>
        } @else {
            @for (tab of tabs; track tab.id) {
            <section class="course-detail-tab-panel" role="tabpanel" [id]="'course-panel-' + tab.id"
                [attr.aria-labelledby]="'course-tab-' + tab.id" [hidden]="activeTabId() !== tab.id" tabindex="0">
            </section>
            }
        }
    </main>
</section>
